name: CI/CD

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ruff как линтер (если уже есть в requirements.txt — ок, если нет — ставим тут)
          pip install ruff

      - name: Run ruff
        run: |
          ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Минимальный .env, чтобы Django стартовал в CI.
      # ВНИМАНИЕ: тесты с БД/Redis тут не поднимаются. Если нужны — скажи, добавлю services: postgres/redis.
      - name: Create .env for CI
        run: |
          cat > .env << EOF
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=True
          DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost
          EOF

      - name: Run tests
        run: |
          python manage.py test

  docker_build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker compose build (check)
        run: |
          docker compose -f docker-compose.yaml build

  deploy:
    needs: docker_build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH (Docker Compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            set -e

            cd /opt/apps/lms

            # Забираем обновления
            git fetch --all
            git reset --hard origin/develop

            # Обновляем/пересобираем и поднимаем сервисы через Docker Compose
            docker compose -f docker-compose.yaml up -d --build

            # (опционально) подчистить неиспользуемые слои/образы
            docker image prune -f

            docker compose -f docker-compose.yaml ps
